<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Widget Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 40px;
    }
    .demo-content {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { color: #1e293b; margin-top: 0; }
    p { color: #64748b; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="demo-content">
    <h1>Your .NET 4.8 Web Application</h1>
    <p>This is a preview page representing your .NET MVC 5 or WebForms application.</p>
    <p>Notice the floating chat bubble in the bottom-right corner. Click it to chat with your FastAPI backend!</p>
  </div>

  <!-- Include Chatbot Widget -->
  <script src="chatbot-widget.js" 
          data-api-url="http://localhost:8000/api/v1/chat"
          data-api-key="your_chatbot_secret_key_here"
          data-bot-title="AI Support Assistant">
  </script>
</body>
</html>
